apiVersion: v1
kind: ConfigMap
metadata:
  name: saf-0304-007-allowed
  namespace: saf-test
data:
  marker: saf-0304-007-granted-marker
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: saf-0304-007-denied
  namespace: saf-test
data:
  marker: saf-0304-007-denied-marker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: saf-0304-007-single-configmap-reader
  namespace: saf-test
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["saf-0304-007-allowed"]
    verbs: ["get"]
