apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: saf-k8s-0403-029-pod-env-secret
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
  validations:
    - expression: >-
          !object.spec.containers.exists(c,
            (has(c.env) && c.env.exists(e,
              has(e.valueFrom) && has(e.valueFrom.secretKeyRef)))
            || (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef))))
          && (!has(object.spec.initContainers) || !object.spec.initContainers.exists(c,
            (has(c.env) && c.env.exists(e,
              has(e.valueFrom) && has(e.valueFrom.secretKeyRef)))
            || (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef)))))
          && (!has(object.spec.ephemeralContainers) || !object.spec.ephemeralContainers.exists(c,
            (has(c.env) && c.env.exists(e,
              has(e.valueFrom) && has(e.valueFrom.secretKeyRef)))
            || (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef)))))
      message: "SAF-K8S-0403-029: Secret references in container environment variables are prohibited"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: saf-k8s-0403-029-pod-env-secret
spec:
  policyName: saf-k8s-0403-029-pod-env-secret
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        saf-k8s-0403-029-enforce: "true"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: saf-k8s-0403-029-deployment-env-secret
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: >-
          !object.spec.template.spec.containers.exists(c,
            (has(c.env) && c.env.exists(e,
              has(e.valueFrom) && has(e.valueFrom.secretKeyRef)))
            || (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef))))
          && (!has(object.spec.template.spec.initContainers) || !object.spec.template.spec.initContainers.exists(c,
            (has(c.env) && c.env.exists(e,
              has(e.valueFrom) && has(e.valueFrom.secretKeyRef)))
            || (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef)))))
      message: "SAF-K8S-0403-029: Secret references in Deployment environment variables are prohibited"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: saf-k8s-0403-029-deployment-env-secret
spec:
  policyName: saf-k8s-0403-029-deployment-env-secret
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        saf-k8s-0403-029-enforce: "true"
