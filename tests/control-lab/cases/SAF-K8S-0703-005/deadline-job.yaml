apiVersion: batch/v1
kind: Job
metadata:
  name: saf-0703-005-deadline-probe
  labels:
    saf-k8s.example/control: SAF-K8S-0703-005
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 20
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        saf-k8s.example/control: SAF-K8S-0703-005
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 1
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inert-sleeper
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "sleep 60"]
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
