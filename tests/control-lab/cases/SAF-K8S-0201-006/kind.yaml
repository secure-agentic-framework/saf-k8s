kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        apiVersion: kubelet.config.k8s.io/v1beta1
        kind: KubeletConfiguration
        systemReserved:
          cpu: 25m
          memory: 32Mi
          ephemeral-storage: 2Mi
        kubeReserved:
          cpu: 35m
          memory: 48Mi
          ephemeral-storage: 1Mi
