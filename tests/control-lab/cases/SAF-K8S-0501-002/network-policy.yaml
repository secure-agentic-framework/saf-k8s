apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: protected-ingress-default-deny
  namespace: saf-0501-002-protected
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-approved-http-from-approved-client
  namespace: saf-0501-002-protected
spec:
  podSelector:
    matchLabels:
      saf-k8s.example/0501-002-role: approved-http
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              saf-k8s.example/0501-002-client-domain: approved
          podSelector:
            matchLabels:
              saf-k8s.example/0501-002-role: approved-client
      ports:
        - protocol: TCP
          port: 8080
