apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: approved-client-dns-only
  namespace: saf-0501-002-trusted
spec:
  podSelector:
    matchLabels:
      saf-k8s.example/0501-002-role: approved-client
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
