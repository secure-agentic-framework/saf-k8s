apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: saf-k8s-0701-001-pod-claim-reference
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE]
        resources: [pods]
  validations:
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v,
          !has(v.persistentVolumeClaim) ||
          v.persistentVolumeClaim.claimName != "saf-rwo-workspace" ||
          request.userInfo.username == "saf-k8s:0701-001-approved-claim-user")
      message: "only the approved fixture identity may reference the protected PVC"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: saf-k8s-0701-001-pod-claim-reference
spec:
  policyName: saf-k8s-0701-001-pod-claim-reference
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        saf-k8s.example/fixture-storage-mode: approved
