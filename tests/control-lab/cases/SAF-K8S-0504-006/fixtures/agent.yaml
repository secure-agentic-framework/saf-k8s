apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent-config
data:
  agent.conf: |
    agent {
      data_dir = "/run/spire/data"
      log_level = "INFO"
      server_address = "spire-server"
      server_port = 8081
      socket_path = "/run/spire/sockets/agent.sock"
      trust_bundle_path = "/run/spire/bootstrap/bundle.pem"
      trust_domain = "saf.test"
    }
    plugins {
      NodeAttestor "k8s_psat" {
        plugin_data {
          cluster = "saf-local"
          token_path = "/run/spire/psat/token"
        }
      }
      KeyManager "memory" { plugin_data {} }
      WorkloadAttestor "k8s" {
        plugin_data {
          kubelet_secure_port = 10250
          kubelet_ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          node_name_env = "K8S_NODE_ADDRESS"
        }
      }
      WorkloadAttestor "unix" { plugin_data {} }
    }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: saf-spire-kubelet-inspect
rules:
  - apiGroups: [""]
    resources: [nodes/pods]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: saf-spire-kubelet-inspect
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: saf-spire-kubelet-inspect
subjects:
  - kind: ServiceAccount
    name: saf-spire-agent
    namespace: saf-test
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
spec:
  selector:
    matchLabels:
      app: spire-agent
  template:
    metadata:
      labels:
        app: spire-agent
    spec:
      serviceAccountName: saf-spire-agent
      hostPID: true
      containers:
        - name: agent
          image: ghcr.io/spiffe/spire-agent:1.16.0@sha256:ab3a8ce70435374cc5d84c81eabf0278dc046ddbc0a736d59694ba9e5975b1b6
          command: ["/opt/spire/bin/spire-agent"]
          args: ["run", "-config", "/run/spire/config/agent.conf"]
          readinessProbe:
            exec:
              command:
                - /opt/spire/bin/spire-agent
                - healthcheck
                - -socketPath
                - /run/spire/sockets/agent.sock
            periodSeconds: 2
            failureThreshold: 30
          env:
            - name: K8S_NODE_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
              readOnly: true
            - name: bootstrap
              mountPath: /run/spire/bootstrap
              readOnly: true
            - name: sockets
              mountPath: /run/spire/sockets
            - name: data
              mountPath: /run/spire/data
            - name: projected-psat
              mountPath: /run/spire/psat
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: spire-agent-config
        - name: bootstrap
          configMap:
            name: spire-agent-bootstrap
        - name: sockets
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: data
          emptyDir: {}
        - name: projected-psat
          projected:
            sources:
              - serviceAccountToken:
                  audience: spire-server
                  expirationSeconds: 900
                  path: token
