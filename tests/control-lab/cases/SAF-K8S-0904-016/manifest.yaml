apiVersion: v1
kind: ConfigMap
metadata:
  name: saf-0904-016-fixtures
  namespace: saf-test
data:
  bridge.py: |
    """Strict fixture-only MLflow dispatch gateway with an append-only audit sink."""
    import base64
    import hmac
    import json
    import os
    from pathlib import Path
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import urlencode
    from urllib.request import Request, urlopen

    BACKEND = "http://localhost:5001"
    MODE = Path("/mode/audit-mode")
    AUDIT = Path("/audit/events.jsonl")
    LOCK = threading.Lock()
    # Fixture-only credentials. The bridge never writes them to a log or response.
    ACTORS = {
        "lab-admin": ("fixture-admin-key-0904", {"administrative"}),
        "lab-reader": ("fixture-reader-key-0904", {"read"}),
        "lab-writer": ("fixture-writer-key-0904", {"write", "delete"}),
    }


    def backend(method, path, body=None):
        payload = None if body is None else json.dumps(body, sort_keys=True).encode()
        request = Request(BACKEND + path, data=payload, method=method,
                          headers={"Content-Type": "application/json"})
        try:
            with urlopen(request, timeout=4) as response:
                raw = response.read()
                status = response.status
        except Exception:
            return 0, {}
        try:
            return status, json.loads(raw or b"{}")
        except (ValueError, TypeError):
            return status, {}


    def audit(actor, operation, resource_id, status):
        if MODE.read_text().strip() != "on":
            return
        event = {"actor": actor, "operation": operation,
                 "resource_id": str(resource_id),
                 "result": "success" if 200 <= status < 300 else "failure"}
        with LOCK:
            with AUDIT.open("a", encoding="utf-8") as stream:
                stream.write(json.dumps(event, sort_keys=True, separators=(",", ":")) + "\n")
                stream.flush()
                os.fsync(stream.fileno())


    class Handler(BaseHTTPRequestHandler):
        server_version = "FixtureAuditBridge/1"

        def log_message(self, _format, *_args):
            # Default BaseHTTPRequestHandler logs request metadata; the fixture is quiet.
            return

        def send_json(self, status, value):
            raw = json.dumps(value, sort_keys=True, separators=(",", ":")).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(raw)))
            self.end_headers()
            self.wfile.write(raw)

        def actor(self):
            header = self.headers.get("Authorization", "")
            if not header.startswith("Basic "):
                return None
            try:
                decoded = base64.b64decode(header[6:], validate=True).decode("utf-8")
                username, password = decoded.split(":", 1)
            except Exception:
                return None
            entry = ACTORS.get(username)
            if entry and hmac.compare_digest(password, entry[0]):
                return username
            return None

        def do_GET(self):
            if self.path == "/health":
                status, _ = backend("GET", "/version")
                self.send_json(200 if status == 200 else 503, {"ready": status == 200})
            else:
                self.send_json(404, {"error": "not_found"})

        def do_POST(self):
            if self.path != "/dispatch":
                self.send_json(404, {"error": "not_found"})
                return
            actor = self.actor()
            if actor is None:
                self.send_json(401, {"error": "unauthenticated"})
                return
            try:
                length = int(self.headers.get("Content-Length", "0"))
                if not 0 < length <= 1024:
                    raise ValueError
                data = json.loads(self.rfile.read(length))
                if set(data) - {"operation", "phase", "experiment_id", "run_id"}:
                    raise ValueError
                phase = data.get("phase")
                if phase not in ("off", "on"):
                    raise ValueError
                operation = data.get("operation")
            except Exception:
                self.send_json(400, {"error": "invalid_fixture_request"})
                return

            # Every operation below is a fixed MLflow REST API call. The request body
            # can select only one fixed operation and a server-issued resource ID.
            if operation == "create_experiment" and actor == "lab-admin":
                api_method, api_path, api_body = "POST", "/api/2.0/mlflow/experiments/create", {
                    "name": "SAF-K8S-0904-016-" + phase,
                    "tags": [{"key": "fixture", "value": "owned"}],
                }
                category, fallback_id = "administrative", "fixture-experiment"
            elif operation == "get_experiment" and actor == "lab-reader":
                experiment_id = data.get("experiment_id", "")
                if not experiment_id.isdecimal():
                    self.send_json(400, {"error": "invalid_fixture_resource"})
                    return
                api_method, api_path, api_body = "GET", "/api/2.0/mlflow/experiments/get?" + urlencode(
                    {"experiment_id": experiment_id}), None
                category, fallback_id = "read", experiment_id
            elif operation == "create_run" and actor == "lab-writer":
                experiment_id = data.get("experiment_id", "")
                if not experiment_id.isdecimal():
                    self.send_json(400, {"error": "invalid_fixture_resource"})
                    return
                api_method, api_path, api_body = "POST", "/api/2.0/mlflow/runs/create", {
                    "experiment_id": experiment_id, "start_time": 1,
                    "run_name": "fixed-audit-witness",
                    "tags": [{"key": "fixture", "value": "owned"}],
                }
                category, fallback_id = "write", experiment_id
            elif operation == "log_parameter" and actor == "lab-writer":
                run_id = data.get("run_id", "")
                if len(run_id) != 32 or any(c not in "0123456789abcdef" for c in run_id):
                    self.send_json(400, {"error": "invalid_fixture_resource"})
                    return
                api_method, api_path, api_body = "POST", "/api/2.0/mlflow/runs/log-parameter", {
                    "run_id": run_id, "key": "fixture_parameter", "value": "fixed-value",
                }
                category, fallback_id = "write", run_id
            elif operation == "delete_run" and actor == "lab-writer":
                run_id = data.get("run_id", "")
                if len(run_id) != 32 or any(c not in "0123456789abcdef" for c in run_id):
                    self.send_json(400, {"error": "invalid_fixture_resource"})
                    return
                api_method, api_path, api_body = "POST", "/api/2.0/mlflow/runs/delete", {"run_id": run_id}
                category, fallback_id = "delete", run_id
            else:
                self.send_json(403, {"error": "operation_not_allowlisted"})
                return

            status, response = backend(api_method, api_path, api_body)
            resource_id = fallback_id
            if status == 200 and operation == "create_experiment":
                resource_id = response.get("experiment_id", fallback_id)
            elif status == 200 and operation == "create_run":
                resource_id = response.get("run", {}).get("info", {}).get("run_id", fallback_id)
            audit(actor, category, resource_id, status)
            if status != 200:
                self.send_json(502, {"error": "tracking_api_failed"})
                return
            # Keep output small and omit all request and credential material.
            if operation == "create_experiment":
                result = {"ok": True, "resource_id": str(resource_id)}
            elif operation == "create_run":
                result = {"ok": True, "resource_id": str(resource_id)}
            else:
                result = {"ok": True, "resource_id": str(resource_id)}
            self.send_json(200, result)


    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
  client.py: |
    """Fixed authenticated requests from the case-owned MLflow client Pod."""
    import base64
    import json
    import sys
    from urllib.request import Request, urlopen

    CREDS = {
        "lab-admin": "fixture-admin-key-0904",
        "lab-reader": "fixture-reader-key-0904",
        "lab-writer": "fixture-writer-key-0904",
    }


    def request(base, actor, operation, phase, **fields):
        body = json.dumps({"operation": operation, "phase": phase, **fields}, sort_keys=True).encode()
        credential = base64.b64encode((actor + ":" + CREDS[actor]).encode()).decode()
        req = Request(base + "/dispatch", data=body, method="POST", headers={
            "Content-Type": "application/json", "Authorization": "Basic " + credential,
        })
        with urlopen(req, timeout=5) as response:
            return json.loads(response.read())


    def phase(base, name):
        experiment = request(base, "lab-admin", "create_experiment", name)
        experiment_id = experiment["resource_id"]
        read = request(base, "lab-reader", "get_experiment", name, experiment_id=experiment_id)
        run = request(base, "lab-writer", "create_run", name, experiment_id=experiment_id)
        run_id = run["resource_id"]
        write = request(base, "lab-writer", "log_parameter", name, run_id=run_id)
        delete = request(base, "lab-writer", "delete_run", name, run_id=run_id)
        return {
            "dispatch": ["administrative", "read", "write", "write", "delete"],
            "http_successes": [True] * 5,
            "api_successes": [all(item.get("ok") is True for item in (experiment, read, run, write, delete))],
            "resource_ids": {"experiment_id": experiment_id, "run_id": run_id},
        }


    if len(sys.argv) == 3 and sys.argv[1] == "--health":
        with urlopen(sys.argv[2] + "/health", timeout=2) as response:
            print(json.dumps({"ready": response.status == 200}, sort_keys=True))
    elif len(sys.argv) == 3 and sys.argv[1] in ("off", "on"):
        try:
            print(json.dumps(phase(sys.argv[2], sys.argv[1]), sort_keys=True))
        except Exception:
            # Never echo request headers, bodies, credentials, or exception strings.
            print(json.dumps({"fixture_request_failed": True}, sort_keys=True))
            raise SystemExit(2)
    elif len(sys.argv) == 4 and sys.argv[1] == "--positive":
        try:
            base, experiment_id = sys.argv[2:]
            result = request(base, "lab-reader", "get_experiment", "on", experiment_id=experiment_id)
            print(json.dumps({"read_succeeded": result.get("ok") is True,
                              "resource_id": result.get("resource_id")}, sort_keys=True))
        except Exception:
            print(json.dumps({"fixture_request_failed": True}, sort_keys=True))
            raise SystemExit(2)
    else:
        raise SystemExit(2)---
apiVersion: v1
kind: ConfigMap
metadata:
  name: saf-0904-016-audit-mode
  namespace: saf-test
data:
  audit-mode: "off"
---
apiVersion: v1
kind: Pod
metadata:
  name: saf-0904-016-tracking
  namespace: saf-test
  labels:
    app: saf-0904-016-tracking
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: mlflow
      image: ghcr.io/mlflow/mlflow:v3.5.1@sha256:7a8c21cd553b84227391ad7daa39c029dab64328da7607c372370cfa07ef43d9
      imagePullPolicy: IfNotPresent
      command: ["mlflow", "server", "--backend-store-uri", "sqlite:////data/mlflow.db", "--default-artifact-root", "/data/artifacts", "--host", "127.0.0.1", "--port", "5001", "--allowed-hosts", "localhost:5001"]
      env:
        - name: HOME
          value: /data
      ports:
        - name: backend
          containerPort: 5001
      resources:
        requests: {cpu: 100m, memory: 320Mi}
        limits: {cpu: 700m, memory: 768Mi}
      volumeMounts:
        - {name: data, mountPath: /data}
    - name: audit-bridge
      image: ghcr.io/mlflow/mlflow:v3.5.1@sha256:7a8c21cd553b84227391ad7daa39c029dab64328da7607c372370cfa07ef43d9
      imagePullPolicy: IfNotPresent
      command: ["python", "-B", "/fixture/bridge.py"]
      ports:
        - {name: api, containerPort: 8080}
      resources:
        requests: {cpu: 20m, memory: 48Mi}
        limits: {cpu: 200m, memory: 128Mi}
      volumeMounts:
        - {name: fixtures, mountPath: /fixture, readOnly: true}
        - {name: mode, mountPath: /mode, readOnly: true}
        - {name: audit, mountPath: /audit}
  volumes:
    - name: fixtures
      configMap:
        name: saf-0904-016-fixtures
    - name: mode
      configMap:
        name: saf-0904-016-audit-mode
    - name: data
      emptyDir:
        sizeLimit: 768Mi
    - name: audit
      emptyDir:
        sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: saf-0904-016-bridge
  namespace: saf-test
spec:
  selector:
    app: saf-0904-016-tracking
  ports:
    - {name: api, port: 8080, targetPort: 8080}
---
apiVersion: v1
kind: Pod
metadata:
  name: saf-0904-016-client
  namespace: saf-test
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: client
      image: ghcr.io/mlflow/mlflow:v3.5.1@sha256:7a8c21cd553b84227391ad7daa39c029dab64328da7607c372370cfa07ef43d9
      imagePullPolicy: IfNotPresent
      command: ["python", "-c", "import time; time.sleep(3600)"]
      resources:
        requests: {cpu: 10m, memory: 48Mi}
        limits: {cpu: 100m, memory: 128Mi}
      volumeMounts:
        - {name: fixtures, mountPath: /fixture, readOnly: true}
  volumes:
    - name: fixtures
      configMap:
        name: saf-0904-016-fixtures
