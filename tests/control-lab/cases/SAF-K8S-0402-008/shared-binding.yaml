apiVersion: v1
kind: ServiceAccount
metadata:
  name: saf-0402-008-shared
  namespace: saf-0402-008
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: saf-0402-008-shared
  namespace: saf-0402-008
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - saf-0402-008-training-data
      - saf-0402-008-inference-model
      - saf-0402-008-pipeline-config
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: saf-0402-008-shared
  namespace: saf-0402-008
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: saf-0402-008-shared
subjects:
  - kind: ServiceAccount
    name: saf-0402-008-shared
    namespace: saf-0402-008
