apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: saf-k8s-0402-022-token-lifetime
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v,
        !has(v.projected) || v.projected.sources.all(s,
        !has(s.serviceAccountToken) ||
        (has(s.serviceAccountToken.expirationSeconds) &&
        s.serviceAccountToken.expirationSeconds >= 600 &&
        s.serviceAccountToken.expirationSeconds <= 3600)))
      message: "serviceAccountToken expirationSeconds must be between 600 and 3600 inclusive"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: saf-k8s-0402-022-token-lifetime
spec:
  policyName: saf-k8s-0402-022-token-lifetime
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        saf-k8s.example/token-lifetime-scope: enforced
