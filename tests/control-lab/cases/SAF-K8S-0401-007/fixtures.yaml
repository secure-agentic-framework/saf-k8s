  name: saf-0401-007
  labels:
    saf-k8s.example/fixture: synthetic-only
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: saf-0401-007-workload
  namespace: saf-0401-007
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
