apiVersion: v1
kind: ServiceAccount
metadata:
  name: saf-0102-014-scheduler
  namespace: saf-test
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: saf-0102-014-scheduler
  namespace: saf-test
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["saf-0102-014-schedule-input"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["saf-0102-014-schedule-not-due", "saf-0102-014-schedule-due"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: saf-0102-014-scheduler
  namespace: saf-test
subjects:
  - kind: ServiceAccount
    name: saf-0102-014-scheduler
    namespace: saf-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: saf-0102-014-scheduler
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: saf-0102-014-scheduler
  namespace: saf-test
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: saf-0102-014-scheduler
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 20
      template:
        metadata:
          labels:
            app.kubernetes.io/name: saf-0102-014-scheduler
        spec:
          serviceAccountName: saf-0102-014-scheduler
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: decide
              image: docker.io/library/python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
              imagePullPolicy: IfNotPresent
              command: ["python", "/fixture/dispatch.py"]
              env:
                - name: JOB_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['batch.kubernetes.io/job-name']
              resources:
                requests:
                  cpu: 10m
                  memory: 24Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: code
                  mountPath: /fixture
                  readOnly: true
          volumes:
            - name: code
              configMap:
                name: saf-0102-014-scheduler-code
