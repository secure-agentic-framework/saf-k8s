apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: saf-waf-proxy
  namespace: saf-test
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
      envoyDeployment:
        replicas: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: saf-waf-class
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: saf-waf-proxy
    namespace: saf-test
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: saf-waf-gateway
  namespace: saf-test
spec:
  gatewayClassName: saf-waf-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: saf-waf-route
  namespace: saf-test
spec:
  parentRefs:
    - name: saf-waf-gateway
  hostnames:
    - waf.lab.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: saf-waf
          port: 8080
