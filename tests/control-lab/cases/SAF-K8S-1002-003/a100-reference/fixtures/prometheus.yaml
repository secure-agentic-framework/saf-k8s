---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saf-prometheus
  namespace: saf-gpu-observe
  labels:
    app.kubernetes.io/name: saf-prometheus
    app.kubernetes.io/part-of: saf-gpu-a100-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: saf-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saf-prometheus
        app.kubernetes.io/part-of: saf-gpu-a100-fixture
    spec:
      serviceAccountName: saf-prometheus
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --storage.tsdb.retention.size=512MB
            - --web.listen-address=0.0.0.0:9090
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: saf-prometheus-config
        - name: data
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: saf-prometheus
  namespace: saf-gpu-observe
  labels:
    app.kubernetes.io/name: saf-prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: saf-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
