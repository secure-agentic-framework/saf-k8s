---
apiVersion: v1
kind: ConfigMap
metadata:
  name: saf-prometheus-config
  namespace: saf-gpu-observe
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      scrape_timeout: 3s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: saf-a100-dcgm
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [saf-gpu-observe]
        relabel_configs:
          - action: keep
            source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: dcgm-exporter
          - action: keep
            source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            regex: dcgm-exporter
          - action: keep
            source_labels: [__meta_kubernetes_pod_label_saf_k8s_example_scrape]
            regex: dcgm-t4
          - action: keep
            source_labels: [__meta_kubernetes_pod_container_port_name]
