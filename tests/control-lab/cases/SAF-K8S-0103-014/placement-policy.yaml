apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: saf-0103-014-placement
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  validations:
    - expression: "!has(object.spec.nodeName) || object.spec.nodeName == ''"
      message: "submit fixture Pods through the scheduler without choosing a direct node"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: saf-0103-014-placement
spec:
  policyName: saf-0103-014-placement
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        saf-k8s.example/placement-policy: "enabled"
