apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: saf-k8s-0304-010-bounded-resources
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        object.spec.containers.all(c, has(c.resources) &&
        has(c.resources.requests) && has(c.resources.limits) &&
        ['cpu', 'memory', 'ephemeral-storage'].all(r, r in c.resources.requests && r in c.resources.limits))
      message: "each regular container must declare CPU, memory, and ephemeral-storage requests and limits"
      reason: Forbidden
    - expression: >-
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(c, has(c.resources) &&
        has(c.resources.requests) && has(c.resources.limits) &&
        ['cpu', 'memory', 'ephemeral-storage'].all(r, r in c.resources.requests && r in c.resources.limits))
      message: "each init container must declare CPU, memory, and ephemeral-storage requests and limits"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: saf-k8s-0304-010-bounded-resources
spec:
  policyName: saf-k8s-0304-010-bounded-resources
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: saf-test
