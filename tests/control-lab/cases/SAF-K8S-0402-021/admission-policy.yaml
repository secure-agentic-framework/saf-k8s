apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: saf-k8s-0402-021-explicit-token-audience
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v,
        !has(v.projected) || v.projected.sources.all(s,
        !has(s.serviceAccountToken) ||
        (has(s.serviceAccountToken.audience) &&
        s.serviceAccountToken.audience in
        ['https://kubernetes.default.svc.cluster.local', 'saf-external-relying-service'])))
      message: "each projected serviceAccountToken source must set an explicit allowed audience"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: saf-k8s-0402-021-explicit-token-audience
spec:
  policyName: saf-k8s-0402-021-explicit-token-audience
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        saf-k8s.example/explicit-token-audience: "enabled"
