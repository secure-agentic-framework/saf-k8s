apiVersion: v1
kind: ServiceAccount
metadata:
  name: saf-0402-021-verifier
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: saf-0402-021-tokenreview-create
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: saf-0402-021-tokenreview-create
subjects:
  - kind: ServiceAccount
    name: saf-0402-021-verifier
    namespace: saf-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: saf-0402-021-tokenreview-create
