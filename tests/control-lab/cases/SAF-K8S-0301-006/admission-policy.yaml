apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: saf-k8s-0301-006-exact-psa-exception
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE]
        resources: [pods]
  validations:
    - expression: >-
        object.metadata.namespace == 'saf-0301-006-namespace-exempt' &&
        object.metadata.name == 'saf-0301-006-device-agent' &&
        has(object.spec.serviceAccountName) &&
        object.spec.serviceAccountName == 'saf-0301-006-device-agent' &&
        has(object.metadata.labels) &&
        'saf-k8s.example/exception-workload' in object.metadata.labels &&
        object.metadata.labels['saf-k8s.example/exception-workload'] == '0301-006' &&
        !has(object.spec.runtimeClassName)
        ||
        object.metadata.namespace == 'saf-0301-006-runtime-exempt' &&
        object.metadata.name == 'saf-0301-006-device-agent' &&
        has(object.spec.serviceAccountName) &&
        object.spec.serviceAccountName == 'saf-0301-006-device-agent' &&
        has(object.metadata.labels) &&
        'saf-k8s.example/exception-workload' in object.metadata.labels &&
        object.metadata.labels['saf-k8s.example/exception-workload'] == '0301-006' &&
        has(object.spec.runtimeClassName) &&
        object.spec.runtimeClassName == 'saf-0301-006-device-runtime'
      message: "PSA exception is limited to the exact synthetic device-agent Pod identity"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: saf-k8s-0301-006-exact-psa-exception
spec:
  policyName: saf-k8s-0301-006-exact-psa-exception
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        saf-k8s.example/psa-exception-case: "0301-006"
