apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: psaexceptionrecords.security.saf-lab.example
spec:
  group: security.saf-lab.example
  scope: Namespaced
  names:
    plural: psaexceptionrecords
    singular: psaexceptionrecord
    kind: PSAExceptionRecord
    shortNames: [psaer]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [workloadRef]
              properties:
                workloadRef:
                  type: object
                  required: [kind, namespace, name]
                  properties:
                    kind:
                      type: string
                    namespace:
                      type: string
                    name:
                      type: string
                privileges:
                  type: array
                  items:
                    type: string
                justification:
                  type: string
                riskOwner:
                  type: string
                compensatingControls:
                  type: array
                  items:
                    type: string
