apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: saf-k8s-0304-012-scratch-bounds
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        !has(object.spec.volumes) ||
        object.spec.volumes.filter(v, has(v.emptyDir) && (!has(v.emptyDir.medium) || v.emptyDir.medium == "")).all(
          v, has(v.emptyDir.sizeLimit) && quantity(string(v.emptyDir.sizeLimit)).isGreaterThan(quantity("0"))
        )
      message: "disk-backed emptyDir needs a positive sizeLimit and regular and init containers need ephemeral-storage requests and limits"
      reason: Forbidden
    - expression: >-
        !has(object.spec.volumes) ||
        !object.spec.volumes.exists(v, has(v.emptyDir) && (!has(v.emptyDir.medium) || v.emptyDir.medium == "")) ||
        (object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])).all(
          c, has(c.resources) && has(c.resources.requests) &&
          "ephemeral-storage" in c.resources.requests &&
          has(c.resources.limits) && "ephemeral-storage" in c.resources.limits
        )
      message: "disk-backed emptyDir needs a positive sizeLimit and regular and init containers need ephemeral-storage requests and limits"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: saf-k8s-0304-012-scratch-bounds
spec:
  policyName: saf-k8s-0304-012-scratch-bounds
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        saf-k8s.example/scratch-budget: required
