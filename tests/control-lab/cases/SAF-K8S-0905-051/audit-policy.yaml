apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: [RequestReceived]
rules:
- level: None
  resources:
  - group: ""
    resources: [serviceaccounts/token, secrets]
- level: Metadata
  users: ["system:serviceaccount:saf-test:saf-0905-051-approver", "oidc-fixture:human-probe"]
  verbs: [patch]
  namespaces: [saf-test]
  resources:
  - group: ""
    resources: [configmaps]
    resourceNames: [@APPROVAL_NAME@]
- level: None
