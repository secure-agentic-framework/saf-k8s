service:
  flush: 1
  log_level: warn
  scheduler.base: 1
  scheduler.cap: 2
pipeline:
  inputs:
    - name: tail
      tag: zot.audit
      path: /events/audit.jsonl
      parser: zot_json
      read_from_head: true
      refresh_interval: 1
    - name: tail
      tag: zot.access
      path: /events/access.jsonl
      parser: zot_json
      read_from_head: true
      refresh_interval: 1
  outputs:
    - name: http
      match: zot.audit
      host: sink.saf-test.svc.cluster.local
      port: 8443
      uri: /audit
      format: json_lines
      json_date_key: false
      workers: 1
      tls: on
      tls.verify: on
      tls.verify_hostname: on
      tls.ca_file: /sink-ca/ca.pem
      http_user: __SINK_USER__
      http_passwd: __SINK_PASSWORD__
      retry_limit: 8
    - name: http
      match: zot.access
      host: sink.saf-test.svc.cluster.local
      port: 8443
      uri: /access
      format: json_lines
      json_date_key: false
      workers: 1
      tls: on
      tls.verify: on
      tls.verify_hostname: on
      tls.ca_file: /sink-ca/ca.pem
      http_user: __SINK_USER__
      http_passwd: __SINK_PASSWORD__
      retry_limit: 8
parsers:
  - name: zot_json
    format: json
