apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: case-client-approved-http-only
  namespace: saf-0501-003-client
spec:
  podSelector:
    matchLabels:
      saf-k8s.example/0501-003-role: case-client
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: saf-0501-003-services
          podSelector:
            matchLabels:
              saf-k8s.example/0501-003-role: approved-http
      ports:
        - protocol: TCP
          port: 8080
