apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-approved-recovery-to-mock-service
  namespace: saf-1005-017-recovery
spec:
  podSelector:
    matchLabels:
      saf-k8s.example/1005-017-role: approved-recovery-client
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: saf-1005-017-protected
          podSelector:
            matchLabels:
              saf-k8s.example/1005-017-role: recovery-mock-endpoint
      ports:
        - protocol: TCP
          port: 8080
