apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: saf-1006-009-evidence
  namespace: saf-1006-009
  labels:
    saf-lab.example/policy-revision: r1
spec:
  validationActions: [Audit]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE]
        resources: [configmaps]
  validations:
    - expression: >-
        has(object.data) && has(object.data.evidence) &&
        object.data.evidence == "present"
      message: "SAF-K8S-1006-009: fixture evidence must be present"
