apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: saf-k8s-0702-005-classification
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        has(object.metadata.labels) &&
        "ai.kais.io/workload-type" in object.metadata.labels &&
        object.metadata.labels["ai.kais.io/workload-type"] in
          ["training", "inference", "preprocessing", "evaluation", "notebook"] &&
        "ai.kais.io/data-sensitivity" in object.metadata.labels &&
        object.metadata.labels["ai.kais.io/data-sensitivity"] in
          ["public", "internal", "confidential", "restricted"] &&
        "ai.kais.io/model-tier" in object.metadata.labels &&
        object.metadata.labels["ai.kais.io/model-tier"] in
          ["experimental", "staging", "production"]
      message: "all three AI workload classification labels must be present and use governed values"
      reason: Forbidden
  auditAnnotations:
    - key: classification-context
      valueExpression: >-
        "kind=Pod;namespace=" + object.metadata.namespace + ";name=" + object.metadata.name +
        ";workload-type=" + (has(object.metadata.labels) &&
        "ai.kais.io/workload-type" in object.metadata.labels ?
        object.metadata.labels["ai.kais.io/workload-type"] : "missing") +
        ";data-sensitivity=" + (has(object.metadata.labels) &&
        "ai.kais.io/data-sensitivity" in object.metadata.labels ?
        object.metadata.labels["ai.kais.io/data-sensitivity"] : "missing") +
        ";model-tier=" + (has(object.metadata.labels) &&
        "ai.kais.io/model-tier" in object.metadata.labels ?
        object.metadata.labels["ai.kais.io/model-tier"] : "missing")
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: saf-k8s-0702-005-classification
spec:
  policyName: saf-k8s-0702-005-classification
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        saf-k8s.example/classification-enforcement: required
