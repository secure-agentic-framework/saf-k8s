apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: saf-0904-007-cronjob-policy
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["cronjobs"]
  matchConditions:
    - name: owned-fixture
      expression: "has(object.metadata.labels) && 'saf.example/control' in object.metadata.labels && object.metadata.labels['saf.example/control'] == 'SAF-K8S-0904-007'"
  validations:
    - expression: "has(object.spec.concurrencyPolicy) && object.spec.concurrencyPolicy == 'Forbid' && has(object.spec.startingDeadlineSeconds) && object.spec.startingDeadlineSeconds >= 60 && has(object.spec.jobTemplate.spec.activeDeadlineSeconds) && object.spec.jobTemplate.spec.activeDeadlineSeconds <= 30 && has(object.spec.jobTemplate.spec.backoffLimit) && object.spec.jobTemplate.spec.backoffLimit == 0 && has(object.spec.jobTemplate.spec.template.spec.serviceAccountName) && object.spec.jobTemplate.spec.template.spec.serviceAccountName == 'saf-0904-007-runner' && has(object.spec.jobTemplate.spec.template.spec.automountServiceAccountToken) && object.spec.jobTemplate.spec.template.spec.automountServiceAccountToken == false"
      message: "SAF-K8S-0904-007 CronJob scheduling, runtime, retry, and identity bounds required"
    - expression: "object.spec.jobTemplate.spec.template.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot == true && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false && has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem == true && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop)"
      message: "SAF-K8S-0904-007 CronJob containers must use the fixture hardening profile"
---
