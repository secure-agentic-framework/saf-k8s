apiVersion: v1
kind: Pod
metadata:
  name: saf-drift-reader
  namespace: saf-test
  labels:
    app: saf-drift-reader
spec:
  automountServiceAccountToken: false
  restartPolicy: Always
  containers:
    - name: reader
      image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["sh", "-c", "while true; do sleep 30; done"]
      volumeMounts:
        - name: marker
          mountPath: /fixture
          readOnly: true
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
  volumes:
    - name: marker
      configMap:
        name: saf-drift-marker
