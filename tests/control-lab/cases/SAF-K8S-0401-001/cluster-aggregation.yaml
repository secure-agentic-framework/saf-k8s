apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: saf-0401-001-child
  labels:
    saf-k8s.example/aggregate-to-0401-001: "true"
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [saf-0401-001-required-config]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: saf-0401-001-aggregate
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        saf-k8s.example/aggregate-to-0401-001: "true"
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: saf-0401-001-aggregated
subjects:
  - kind: Group
    name: saf-k8s.example:0401-001-aggregated-reviewers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: saf-0401-001-aggregate
