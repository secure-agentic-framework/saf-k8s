rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["saf-0304-009-handoff"]
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: saf-0304-009-handoff-producer
subjects:
- kind: ServiceAccount
  name: checkpoint-producer
