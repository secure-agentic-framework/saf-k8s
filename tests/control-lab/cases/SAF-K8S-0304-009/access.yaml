apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkpoint-training
  namespace: saf-test
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkpoint-outsider
  namespace: saf-test
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: checkpoint-training-access
  namespace: saf-test
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["saf-0304-009-checkpoint"]
    verbs: ["get", "patch"]
