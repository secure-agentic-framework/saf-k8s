apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: saf-lab-1006-010-lifecycle-decision
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [configmaps]
  matchConditions:
    - name: reviewer-or-decision-object
      expression: >-
        request.userInfo.username == 'system:serviceaccount:saf-test:fixture-exception-renewal-reviewer' ||
        object.metadata.name == 'saf-lab-1006-010-renewal-decision'
  validations:
    - expression: >-
        (request.userInfo.username == 'system:serviceaccount:saf-test:fixture-exception-renewal-reviewer' &&
        object.metadata.namespace == 'saf-test' &&
        object.metadata.name == 'saf-lab-1006-010-renewal-decision' &&
        object.immutable == true &&
        object.data.decision == 'close-no-renewal' &&
        object.data.recordName == 'exact-approved' &&
        object.data.policyRef == 'ai-workload-compliance' &&
        object.data.scopeNamespace == 'saf-test' &&
        object.data.scopeKind == 'Deployment' &&
        object.data.scopeName == 'saf-ai-exception-workload' &&
        object.data.deciderIdentity == request.userInfo.username &&
        size(object.data.justification.trim()) > 0 &&
        object.data.expiresAt.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'))
      message: >-
        SAF-LAB-1006-010: only the authenticated lifecycle reviewer may retain the exact bounded closure decision
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: saf-lab-1006-010-lifecycle-decision
spec:
  policyName: saf-lab-1006-010-lifecycle-decision
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        saf-lab.example/exception-test: "true"

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: saf-lab-1006-010-authorized-closure
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [saf-lab.example]
        apiVersions: [v1alpha1]
        operations: [DELETE]
        resources: [policyexceptions]
  matchConditions:
    - name: exact-closure-operator
      expression: >-
        request.userInfo.username == 'system:serviceaccount:saf-test:fixture-exception-closure-operator' &&
        oldObject.metadata.name == 'exact-approved'
  validations:
    - message: SAF-LAB-1006-010 closure requires the exact retained reviewer decision and exception UID
      reason: Forbidden
      expression: >-
        params != null && params.immutable == true &&
        params.data.decision == 'close-no-renewal' &&
        params.data.recordUid == string(oldObject.metadata.uid) &&
        params.data.recordName == oldObject.metadata.name &&
        params.data.policyRef == oldObject.spec.policyRef &&
        params.data.scopeNamespace == oldObject.spec.scope.namespace &&
        params.data.scopeKind == oldObject.spec.scope.kind &&
        params.data.scopeName == oldObject.spec.scope.name &&
        params.data.expiresAt == oldObject.spec.expiresAt
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: saf-lab-1006-010-authorized-closure
spec:
  policyName: saf-lab-1006-010-authorized-closure
  validationActions: [Deny]
  paramRef:
    name: saf-lab-1006-010-renewal-decision
    namespace: saf-test
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        saf-lab.example/exception-test: "true"
