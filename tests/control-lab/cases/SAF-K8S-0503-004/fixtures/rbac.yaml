apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: service-exposure-writer
  namespace: saf-test
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-service-writer
  namespace: saf-test
subjects:
  - kind: ServiceAccount
    name: tenant
    namespace: saf-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: service-exposure-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: approved-exception-service-writer
  namespace: saf-test
subjects:
  - kind: ServiceAccount
    name: lb-exception-approver
    namespace: saf-approvers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: service-exposure-writer
