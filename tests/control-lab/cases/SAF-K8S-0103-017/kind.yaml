kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
kubeadmConfigPatches:
  - |
    apiVersion: kubeadm.k8s.io/v1beta4
    kind: ClusterConfiguration
    controllerManager:
      extraArgs:
        - name: bind-address
          value: 127.0.0.1
    scheduler:
      extraArgs:
        - name: bind-address
          value: 127.0.0.1
