kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
kubeadmConfigPatches:
  - |
    apiVersion: kubelet.config.k8s.io/v1beta1
    kind: KubeletConfiguration
    cpuManagerPolicy: static
    systemReserved:
      cpu: 100m
nodes:
  - role: control-plane
  - role: worker
    kubeadmConfigPatches:
      - |
        apiVersion: kubeadm.k8s.io/v1beta4
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            - name: node-labels
              value: saf.example/node-pool=general
  - role: worker
    kubeadmConfigPatches:
      - |
        apiVersion: kubeadm.k8s.io/v1beta4
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: saf.example/ai-pool
              value: reserved
              effect: NoSchedule
          kubeletExtraArgs:
            - name: node-labels
              value: saf.example/node-pool=ai
