groups:
  - name: saf-k8s-service-ip-capacity
    rules:
      - alert: KubernetesServiceIPPoolLow
        expr: |
          kube_apiserver_clusterip_allocator_available_ips
          /
          (
            kube_apiserver_clusterip_allocator_available_ips
            + kube_apiserver_clusterip_allocator_allocated_ips
          ) < 0.50
        labels:
          severity: warning
          scope: service-cidr
        annotations:
          summary: "Service ClusterIP pool has less than half its measured capacity available"
          description: "Review ServiceCIDR capacity and allocation trends before service creation is affected."
  - name: saf-k8s-pod-ip-capacity
    rules:
      - alert: KubernetesKindPodIPPoolLow
        expr: saf_lab_kind_pod_ipam_available < 9
        labels:
          severity: warning
          scope: pod-cidr
        annotations:
          summary: "Owned Kind Pod IPAM pool is below the exercise warning threshold"
