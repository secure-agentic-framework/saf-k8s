groups:
  - name: saf-etcd-health
    rules:
      - alert: EtcdTelemetryUnavailable
        expr: up{job="etcd"} == 0 or absent(up{job="etcd"})
        for: 2m
      - alert: EtcdNoLeader
        expr: etcd_server_has_leader{job="etcd"} == 0
        for: 2m
      - alert: EtcdStorageQuotaPressure
        expr: etcd_mvcc_db_total_size_in_bytes{job="etcd"} / etcd_server_quota_backend_bytes{job="etcd"} > 0.90
        for: 3m
      - alert: EtcdMemberApplyLag
        expr: etcd_server_proposals_committed_total{job="etcd"} - etcd_server_proposals_applied_total{job="etcd"} > 1000
        for: 2m
      - alert: EtcdMemberReplicationLag
        expr: max by (cluster) (etcd_server_proposals_committed_total{job="etcd"}) - on (cluster) group_right etcd_server_proposals_committed_total{job="etcd"} > 1000
        for: 2m
      - alert: EtcdHighWalLatency
        expr: histogram_quantile(0.99, sum by (le, instance, cluster) (rate(etcd_disk_wal_fsync_duration_seconds_bucket{job="etcd"}[5m]))) > 0.5
        for: 2m
      - alert: EtcdHighBackendLatency
        expr: histogram_quantile(0.99, sum by (le, instance, cluster) (rate(etcd_disk_backend_commit_duration_seconds_bucket{job="etcd"}[5m]))) > 0.25
        for: 2m
      - alert: EtcdSlowPeer
        expr: histogram_quantile(0.99, sum by (le, instance, cluster, To) (rate(etcd_network_peer_round_trip_time_seconds_bucket{job="etcd"}[5m]))) > 0.15
        for: 2m
      - alert: EtcdPeerTelemetryUnavailable
        expr: >-
          (
            etcd_expected_peer_count{job="etcd"}
            > on (job, instance, cluster)
              (
                count by (job, instance, cluster) (
                  count by (job, instance, cluster, To) (
                    etcd_network_peer_round_trip_time_seconds_bucket{job="etcd",le="+Inf",To!=""}
                  )
                )
                or on (job, instance, cluster) (0 * etcd_expected_peer_count{job="etcd"})
              )
          ) and on (job, instance, cluster) (up{job="etcd"} == 1)
        for: 2m
      # Expected-member and quorum series are custom collector/inventory inputs,
      # not native etcd metrics. They are included to distinguish missing scrape
      # coverage from an explicitly observed loss of quorum.
      - alert: EtcdMemberScrapeUnknown
        expr: etcd_expected_member{job="etcd"} unless on (job, cluster, instance) (up{job="etcd"} == 1)
        for: 2m
      - alert: EtcdQuorumUnknown
        expr: etcd_expected_cluster{job="etcd"} unless on (job, cluster) etcd_cluster_quorum_available{job="etcd"}
        for: 2m
      - alert: EtcdQuorumUnavailable
        expr: etcd_cluster_quorum_available{job="etcd"} == 0
        for: 2m
