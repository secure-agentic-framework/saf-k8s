apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: saf-0605-002-namespace-companion
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE]
        resources: [namespaces]
  matchConditions:
    - name: case-owned-managed-namespace
      expression: >-
        object.metadata.name == "saf-0605-002" &&
        has(object.metadata.labels) &&
        "saf-k8s.example/generate" in object.metadata.labels &&
        object.metadata.labels["saf-k8s.example/generate"] == "true"
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: saf-0605-002-companion
            namespace: (( object.metadata.name ))
            labels:
              saf-k8s.example/generated-by: saf-0605-002-namespace-companion
          data:
            purpose: inert generated companion
