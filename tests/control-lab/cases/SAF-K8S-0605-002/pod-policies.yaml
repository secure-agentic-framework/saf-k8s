apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: saf-0605-002-pod-baseline
  namespace: saf-0605-002
spec:
  validationActions: [Audit]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE]
        resources: [pods]
  validations:
    - expression: >-
        has(object.metadata.labels) &&
        "saf-k8s.example/required" in object.metadata.labels &&
        object.metadata.labels["saf-k8s.example/required"] == "yes" &&
        has(object.spec.securityContext) &&
        has(object.spec.securityContext.runAsNonRoot) &&
        object.spec.securityContext.runAsNonRoot == true
      message: >-
        SAF-K8S-0605-002: pod requires label saf-k8s.example/required=yes
        and spec.securityContext.runAsNonRoot=true
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedMutatingPolicy
metadata:
  name: saf-0605-002-pod-defaults
  namespace: saf-0605-002
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE]
        resources: [pods]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            metadata: Object.metadata{
              labels: {"saf-k8s.example/mutated": "true"}
            },
            spec: Object.spec{
              securityContext: Object.spec.securityContext{
                runAsNonRoot: true,
                seccompProfile: Object.spec.securityContext.seccompProfile{
                  type: "RuntimeDefault"
                }
              }
            }
          }
