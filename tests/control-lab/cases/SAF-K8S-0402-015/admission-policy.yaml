apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deny-new-legacy-service-account-token-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: saf-test
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
        scope: Namespaced
  validations:
    - expression: "object.type != 'kubernetes.io/service-account-token'"
      message: "Secret type kubernetes.io/service-account-token is not permitted for new Secrets"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: deny-new-legacy-service-account-token-secrets
spec:
  policyName: deny-new-legacy-service-account-token-secrets
  validationActions: [Deny]
