apiVersion: v1
kind: ServiceAccount
metadata:
  name: saf-0901-006-tenant
  namespace: saf-0901-006
  labels:
    saf-k8s.example/identity: synthetic-tenant
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: saf-0901-006-platform
  namespace: saf-0901-006
  labels:
    saf-k8s.example/identity: synthetic-platform
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: saf-0901-006-tenant-workload
  namespace: saf-0901-006
  annotations:
    saf-k8s.example/fixture: synthetic-only
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: saf-0901-006-tenant-workload
  namespace: saf-0901-006
subjects:
  - kind: ServiceAccount
    name: saf-0901-006-tenant
    namespace: saf-0901-006
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: saf-0901-006-tenant-workload
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: saf-0901-006-resourcequota-admin
  namespace: saf-0901-006
  annotations:
    saf-k8s.example/fixture: bounded-platform-positive-control
rules:
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: saf-0901-006-resourcequota-admin
  namespace: saf-0901-006
subjects:
  - kind: ServiceAccount
    name: saf-0901-006-platform
    namespace: saf-0901-006
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: saf-0901-006-resourcequota-admin
