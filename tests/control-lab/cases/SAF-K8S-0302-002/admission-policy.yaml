apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: saf-k8s-0302-002-capability-boundary
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        saf-k8s.example/capability-reference: "enabled"
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: ["pods", "pods/ephemeralcontainers"]
  variables:
    - name: approvedAddedCapabilities
      expression: "['CHOWN', 'NET_BIND_SERVICE']"
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.securityContext) && has(c.securityContext.capabilities) &&
          has(c.securityContext.capabilities.drop) &&
          'ALL' in c.securityContext.capabilities.drop &&
          (!has(c.securityContext.capabilities.add) ||
            c.securityContext.capabilities.add.all(cap, cap in variables.approvedAddedCapabilities))) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c,
          has(c.securityContext) && has(c.securityContext.capabilities) &&
          has(c.securityContext.capabilities.drop) &&
          'ALL' in c.securityContext.capabilities.drop &&
          (!has(c.securityContext.capabilities.add) ||
            c.securityContext.capabilities.add.all(cap, cap in variables.approvedAddedCapabilities)))) &&
        (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c,
          has(c.securityContext) && has(c.securityContext.capabilities) &&
          has(c.securityContext.capabilities.drop) &&
          'ALL' in c.securityContext.capabilities.drop &&
          (!has(c.securityContext.capabilities.add) ||
            c.securityContext.capabilities.add.all(cap, cap in variables.approvedAddedCapabilities))))
      message: "every regular, init, and ephemeral container must drop ALL and may add only CHOWN or NET_BIND_SERVICE"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: saf-k8s-0302-002-capability-boundary
spec:
  policyName: saf-k8s-0302-002-capability-boundary
  validationActions: [Deny]
