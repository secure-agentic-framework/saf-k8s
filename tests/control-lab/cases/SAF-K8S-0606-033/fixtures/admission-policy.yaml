apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: saf-git-only-deployments
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["deployments"]
  validations:
    - expression: request.userInfo.username == "system:serviceaccount:argocd:argocd-application-controller"
      message: "Production Deployment changes must be applied by the approved GitOps controller."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: saf-git-only-deployments
spec:
  policyName: saf-git-only-deployments
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        saf.example.test/git-only: "true"
