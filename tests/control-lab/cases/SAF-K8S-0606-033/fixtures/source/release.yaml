apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-approved-demo
  labels:
    app.kubernetes.io/name: git-approved-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: git-approved-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-approved-demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: marker
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
