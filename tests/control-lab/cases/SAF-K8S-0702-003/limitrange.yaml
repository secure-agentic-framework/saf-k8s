apiVersion: v1
kind: LimitRange
metadata:
  name: workload-bounds
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 32Mi
        ephemeral-storage: 16Mi
      default:
        cpu: 100m
        memory: 64Mi
        ephemeral-storage: 32Mi
      max:
        cpu: 200m
        memory: 128Mi
        ephemeral-storage: 64Mi
    - type: Pod
      max:
        cpu: 300m
        memory: 192Mi
        ephemeral-storage: 96Mi
