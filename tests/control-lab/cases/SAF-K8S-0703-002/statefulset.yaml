apiVersion: v1
kind: Service
metadata:
  name: pdb-stateful-probe
  namespace: saf-test
spec:
  selector:
    saf-lab.example/control: SAF-K8S-0703-002-stateful
  clusterIP: None
  ports:
  - name: fixture
    port: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pdb-stateful-probe
  namespace: saf-test
spec:
  replicas: 2
  serviceName: pdb-stateful-probe
  selector:
    matchLabels:
      saf-lab.example/control: SAF-K8S-0703-002-stateful
  template:
    metadata:
      labels:
        saf-lab.example/control: SAF-K8S-0703-002-stateful
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: hold
        image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
        command:
        - sh
        - -c
        - sleep 3600
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
