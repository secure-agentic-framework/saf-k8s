apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-alice
  namespace: saf-test
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-bob
  namespace: saf-test
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: dataset-alice
  namespace: saf-test
  labels:
    saf.example/fixture: dataset
    saf.example/dataset-owner: alice
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: endpoint
    image: docker.io/library/python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
    imagePullPolicy: IfNotPresent
    command:
    - python
    - -u
    - -c
    - |
      import http.server, ipaddress, json, threading
      BODY = b'benign-dataset-alice'
      CAP = 256
      MAX_CLIENTS = 16
      STATE = {"total": 0, "overflow": False, "clients": {}}
      LOCK = threading.Lock()

      def reply(handler, status, payload, content_type="text/plain"):
          handler.send_response(status)
          handler.send_header("Content-Length", str(len(payload)))
          handler.send_header("Content-Type", content_type)
          handler.end_headers()
          if payload:
              handler.wfile.write(payload)

      class Handler(http.server.BaseHTTPRequestHandler):
          def do_GET(self):
              peer_text = self.client_address[0]
              if self.path == "/__audit":
                  try: loopback = ipaddress.ip_address(peer_text).is_loopback
                  except ValueError: loopback = False
                  if not loopback:
                      reply(self, 404, b"")
                      return
                  with LOCK:
                      snapshot = {"cap": CAP, "total": STATE["total"], "overflow": STATE["overflow"],
                                  "clients": {ip: dict(values) for ip, values in STATE["clients"].items()}}
                  reply(self, 200, json.dumps(snapshot, sort_keys=True, separators=(",", ":")).encode(), "application/json")
                  return
              if self.path != "/":
                  reply(self, 404, b"")
                  return
              try: peer = str(ipaddress.ip_address(peer_text))
              except ValueError:
                  reply(self, 400, b"")
                  return
              with LOCK:
                  can_record = (STATE["total"] < CAP and
                                (peer in STATE["clients"] or len(STATE["clients"]) < MAX_CLIENTS))
                  if not can_record:
                      STATE["overflow"] = True
              # Keep the fixture response unchanged when the observation cap is hit.
              reply(self, 200, BODY)
              if can_record:
                  with LOCK:
                      row = STATE["clients"].setdefault(peer, {"gets": 0, "status_200": 0, "response_bytes": 0})
                      row["gets"] += 1
                      row["status_200"] += 1
                      row["response_bytes"] += len(BODY)
                      STATE["total"] += 1

          def log_message(self, *_args):
              return

      http.server.HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
    ports:
    - name: http
      containerPort: 8080
    readinessProbe:
      tcpSocket:
        port: 8080
      periodSeconds: 1
      failureThreshold: 45
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 96Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
---
