apiVersion: v1
kind: Pod
metadata:
  name: workspace-alice
  namespace: saf-test
  labels:
    saf.example/workspace: 'true'
    saf.example/workspace-owner: alice
spec:
  serviceAccountName: workspace-alice
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
    runAsGroup: 100
    fsGroup: 100
  containers:
  - name: workspace
    image: quay.io/jupyter/base-notebook:2025-04-01@sha256:18691156c62dd82b69951329ee000fa0ca76f1bea6c105ac92c5754a8d92b828
    imagePullPolicy: IfNotPresent
    command:
    - /opt/conda/bin/python
    - -B
    - -c
    - import time; time.sleep(600)
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    env:
    - name: HOME
      value: /tmp
    - name: JUPYTER_RUNTIME_DIR
      value: /tmp
    - name: IPYTHONDIR
      value: /tmp/ipython
    volumeMounts:
    - name: runtime
      mountPath: /tmp
  volumes:
  - name: runtime
    emptyDir:
      sizeLimit: 64Mi
---
