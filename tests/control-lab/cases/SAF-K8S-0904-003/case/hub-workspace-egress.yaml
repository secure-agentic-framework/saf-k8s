  labels:
    saf.example/fixture: hub-spawn-egress
spec:
  podSelector:
    matchLabels:
      hub.jupyter.org/username: saf-workspace-bob
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              saf.example/dataset-owner: bob
      ports:
        - protocol: TCP
          port: 8080
