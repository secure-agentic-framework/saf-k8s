apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: saf-0501-001-default-deny
spec:
  evaluation:
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  matchConditions:
    - name: exact-owned-enrolled-workload-namespace
      expression: >-
        object.metadata.name in [
          "saf-0501-001-managed-a",
          "saf-0501-001-managed-b",
          "saf-0501-001-managed-late"
        ] &&
        has(object.metadata.labels) &&
        "saf-k8s.example/0501-001-network-policy" in object.metadata.labels &&
        object.metadata.labels["saf-k8s.example/0501-001-network-policy"] == "enabled"
  variables:
    - name: namespaceName
      expression: object.metadata.name
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: saf-0501-001-default-deny-ingress
            namespace: (( variables.namespaceName ))
            labels:
              saf-k8s.example/0501-001-generated-by: saf-0501-001-default-deny
              saf-k8s.example/0501-001-direction: ingress
          spec:
            podSelector: {}
            policyTypes: [Ingress]
          ---
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: saf-0501-001-default-deny-egress
            namespace: (( variables.namespaceName ))
            labels:
              saf-k8s.example/0501-001-generated-by: saf-0501-001-default-deny
              saf-k8s.example/0501-001-direction: egress
          spec:
            podSelector: {}
            policyTypes: [Egress]
