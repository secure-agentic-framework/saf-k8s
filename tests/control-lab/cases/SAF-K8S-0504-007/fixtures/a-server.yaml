---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  namespace: saf-fed-a
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: saf-spire-agent
  namespace: saf-fed-a
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: saf-workload
  namespace: saf-fed-a
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server-config
  namespace: saf-fed-a
data:
  server.conf: "server {\n  bind_address = \"0.0.0.0\"\n  bind_port = 8081\n  trust_domain\
    \ = \"a.saf.test\"\n  data_dir = \"/run/spire/data\"\n  log_level = \"INFO\"\n\
    \  default_x509_svid_ttl = \"600s\"\n}\nplugins {\n  DataStore \"sql\" {\n   \
    \ plugin_data {\n      database_type = \"sqlite3\"\n      connection_string =\
    \ \"/run/spire/data/datastore.sqlite3\"\n    }\n  }\n  KeyManager \"memory\" {\
    \ plugin_data {} }\n  NodeAttestor \"k8s_psat\" {\n    plugin_data {\n      clusters\
    \ = {\n        \"saf-a\" = {\n          service_account_allow_list = [\"saf-fed-a:saf-spire-agent\"\
    ]\n        }\n      }\n    }\n  }\n}\n"
---
apiVersion: v1
kind: Service
metadata:
  name: spire-server
  namespace: saf-fed-a
spec:
  selector:
    app: spire-server
  ports:
  - name: server
    port: 8081
    targetPort: 8081
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: saf-fed-a
spec:
  serviceName: spire-server
  replicas: 1
  selector:
    matchLabels:
      app: spire-server
  template:
    metadata:
      labels:
        app: spire-server
    spec:
      serviceAccountName: spire-server
      containers:
      - name: server
        image: ghcr.io/spiffe/spire-server:1.16.0@sha256:ff546f4c62dafc479a0cd79eae9a7b6df2975754d75efd31706098e0d7548837
        command:
        - /opt/spire/bin/spire-server
        args:
        - run
        - -config
        - /run/spire/config/server.conf
        ports:
        - containerPort: 8081
        readinessProbe:
          tcpSocket:
            port: 8081
          periodSeconds: 2
          failureThreshold: 30
        volumeMounts:
        - name: config
          mountPath: /run/spire/config
          readOnly: true
        - name: data
          mountPath: /run/spire/data
        - name: foreign-bootstrap
          mountPath: /run/spire/foreign
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: spire-server-config
      - name: data
        emptyDir: {}
      - name: foreign-bootstrap
        configMap:
          name: federation-bootstrap-b
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: saf-spire-psat-review-a
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - ''
  resources:
  - pods
  - nodes
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: saf-spire-psat-review-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: saf-spire-psat-review-a
subjects:
- kind: ServiceAccount
  name: spire-server
  namespace: saf-fed-a
